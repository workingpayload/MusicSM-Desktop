[versions]
kotlin = "2.3.20"
compose-multiplatform = "1.12.1"
coroutines = "1.11.0"
okhttp = "4.12.0"
ktor = "3.5.2"
kotlinxSerialization = "1.11.0"
newpipeExtractor = "v0.26.5"
javaxInject = "1"
vlcj = "4.11.0"
jnativehook = "2.2.2"
junit = "4.13.2"
coil = "3.6.0"
haze = "1.6.10"
backdrop = "2.0.1"
zxing = "3.5.3"
jaudiotagger = "3.0.1"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
newpipe-extractor = { group = "com.github.TeamNewPipe", name = "NewPipeExtractor", version.ref = "newpipeExtractor" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
vlcj = { group = "uk.co.caprica", name = "vlcj", version.ref = "vlcj" }
jnativehook = { group = "com.github.kwhat", name = "jnativehook", version.ref = "jnativehook" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-encoding = { group = "io.ktor", name = "ktor-client-encoding", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
# Kyant's Liquid Glass (Compose Multiplatform) — same library and version as the mobile app.
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
zxing-javase = { group = "com.google.zxing", name = "javase", version.ref = "zxing" }
jaudiotagger = { group = "net.jthink", name = "jaudiotagger", version.ref = "jaudiotagger" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
